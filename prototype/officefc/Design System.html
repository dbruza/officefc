<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OfficeFC — Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Saira+Condensed:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#070a0e; --surface:#10141b; --surface-2:#1a212b; --line:rgba(255,255,255,.08);
    --text:#eef2f6; --text-dim:#8b95a4; --text-faint:#4c5563;
    --accent:#00ff87; --win:#22e06a; --draw:#9aa6b4; --loss:#ff4d6d;
    --font-head:'Archivo',system-ui,sans-serif; --font-body:'Archivo',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:radial-gradient(ellipse at 50% -5%, #121a24, #05070a 55%);
    font-family:var(--font-body);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;}
  button{font-family:inherit;color:inherit;border:none;background:none;}
  a{text-decoration:none;color:inherit;}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}

  /* shared atom styles (mirror prototype) */
  .kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);font-weight:700;font-family:var(--font-head);line-height:1.4;}
  .ofc-btn{transition:transform .12s;} .ofc-btn:active{transform:scale(.97);}
  .ofc-row{transition:border-color .15s;}
  .tag-you{font-family:var(--font-mono);font-size:8.5px;font-weight:800;letter-spacing:.1em;background:var(--accent);color:#06080c;padding:2px 5px;border-radius:5px;}
  .season-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--text-dim);font-weight:700;font-size:12.5px;font-family:var(--font-head);}
  .season-chip.active{background:var(--text);color:#06080c;border-color:var(--text);}
  .live-dot{width:6px;height:6px;border-radius:9px;background:var(--win);}
  .nemesis-tag{font-family:var(--font-mono);font-size:8px;font-weight:800;letter-spacing:.12em;color:var(--loss);border:1px solid color-mix(in srgb,var(--loss) 45%,transparent);background:color-mix(in srgb,var(--loss) 12%,transparent);padding:3px 6px;border-radius:6px;display:inline-block;}
  .res-dot{width:24px;height:24px;border-radius:7px;display:inline-grid;place-items:center;font-family:var(--font-mono);font-weight:800;font-size:12px;}
  .res-W{background:var(--win);color:#06080c;} .res-L{background:var(--loss);color:#fff;} .res-D{background:var(--draw);color:#06080c;}

  /* page layout */
  .ds-page{max-width:1080px;margin:0 auto;padding:40px 28px 80px;}
  .ds-header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
    padding-bottom:28px;margin-bottom:36px;border-bottom:1px solid var(--line);}
  .ds-logo{display:flex;align-items:center;gap:14px;}
  .ds-logo-mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:#06080c;}
  .ds-logo-name{font-family:var(--font-head);font-weight:900;font-size:26px;letter-spacing:-.03em;}
  .ds-logo-tag{font-size:12.5px;color:var(--text-dim);margin-top:2px;}
  .ds-cta{padding:11px 18px;border-radius:12px;background:var(--accent);color:#06080c;font-family:var(--font-head);font-weight:800;font-size:14px;}

  section{margin-bottom:48px;}
  .ds-h2{font-family:var(--font-head);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:12px;margin:0 0 6px;}
  .ds-num{font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:7px;padding:3px 7px;}
  .ds-lead{color:var(--text-dim);font-size:14.5px;line-height:1.55;max-width:680px;margin:0 0 22px;}

  .ds-swatch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}
  .ds-swatch{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;}
  .ds-swatch-chip{width:46px;height:46px;border-radius:11px;flex:0 0 auto;}
  .ds-swatch-name{font-weight:700;font-size:13.5px;}
  .ds-swatch-hex{font-size:11.5px;color:var(--text-dim);margin-top:1px;}
  .ds-swatch-var{font-size:10.5px;color:var(--text-faint);margin-top:1px;}

  .ds-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .ds-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;}
  .ds-card-head{display:flex;flex-direction:column;align-items:flex-start;gap:3px;margin-bottom:14px;}
  .ds-card-title{font-family:var(--font-head);font-weight:700;font-size:14px;}
  .ds-card-sub{font-size:11px;color:var(--text-dim);}
  .ds-card-body{flex:1;}
  .ds-spec-note{font-size:11.5px;color:var(--text-dim);margin-top:12px;line-height:1.4;}
  .ds-mini-legend{display:flex;gap:14px;margin-top:14px;font-size:12px;color:var(--text-dim);}
  .ds-mini-legend span{display:flex;align-items:center;gap:6px;}
  .ds-dot{width:10px;height:10px;border-radius:3px;display:inline-block;}

  .ds-screens{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .ds-screen-link{display:flex;align-items:center;gap:12px;padding:15px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-weight:700;font-size:14px;transition:border-color .15s;}
  .ds-screen-link:hover{border-color:color-mix(in srgb,var(--accent) 40%,transparent);}
  .ds-screen-dot{width:9px;height:9px;border-radius:9px;background:var(--accent);box-shadow:0 0 8px var(--accent);}

  .ds-footer{text-align:center;color:var(--text-faint);font-size:12px;padding-top:30px;border-top:1px solid var(--line);}

  @media(max-width:820px){.ds-grid{grid-template-columns:1fr 1fr;}.ds-screens{grid-template-columns:1fr;}}
  @media(max-width:560px){.ds-grid{grid-template-columns:1fr;}.ds-card[style*="span"]{grid-column:auto !important;}}
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="app/data.js?v=3"></script>
  <script type="text/babel" src="app/ui.jsx?v=3"></script>
  <script type="text/babel" src="app/screens-main.jsx?v=3"></script>
  <script type="text/babel" src="app/screens-detail.jsx?v=3"></script>
  <script type="text/babel" src="app/showcase.jsx?v=3"></script>
</body>
</html>
