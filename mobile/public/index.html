<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no"
    />
    <title>%WEB_TITLE%</title>
    <meta
      name="description"
      content="OfficeFC — the office EA SPORTS FC league. Log matches, climb the ELO table, win the finals."
    />
    <meta name="theme-color" content="#070a0e" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OfficeFC" />
    <meta property="og:title" content="OfficeFC" />
    <meta property="og:description" content="The office EA SPORTS FC league table." />
    <meta property="og:image" content="/icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style id="expo-reset">
      /* Paint the app background before any JS runs — no white flash on load. */
      html,
      body {
        height: 100%;
        background: #070a0e;
        color: #eef2f6;
        color-scheme: dark;
      }
      /* The app scrolls inside its own ScrollViews. */
      body {
        overflow: hidden;
        margin: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      ::selection {
        background: rgba(0, 255, 135, 0.28);
        color: #ffffff;
      }

      /* Slim dark scrollbars that match the surfaces. */
      * {
        scrollbar-width: thin;
        scrollbar-color: #2a3340 transparent;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: #2a3340;
        border-radius: 10px;
        border: 3px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: #3a4656;
      }

      /* Keyboard focus ring for every pressable; mouse clicks don't show it. */
      [tabindex]:focus-visible,
      a:focus-visible,
      button:focus-visible {
        outline: 2px solid rgba(0, 255, 135, 0.85);
        outline-offset: 2px;
      }
      :focus:not(:focus-visible) {
        outline: none;
      }
      /* Text fields draw their own focus state on the wrapper. */
      input:focus-visible,
      textarea:focus-visible {
        outline: none;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Boot splash — replaced as soon as React renders into #root. */
      .boot {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      .boot-mark {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        letter-spacing: 3px;
        font-size: 17px;
      }
      .boot-mark b {
        color: #00ff87;
      }
      .boot-ball {
        animation: boot-spin 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .boot-bar {
        width: 120px;
        height: 3px;
        border-radius: 3px;
        background: #1a212b;
        overflow: hidden;
      }
      .boot-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #00ff87;
        animation: boot-slide 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run OfficeFC.</noscript>
    <div id="root">
      <div class="boot" aria-label="Loading OfficeFC">
        <div class="boot-mark">
          <svg
            class="boot-ball"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#00ff87"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="m12 7 3 2.2-1.1 3.6h-3.8L9 9.2 12 7Z" />
          </svg>
          <span>OFFICE<b>FC</b></span>
        </div>
        <div class="boot-bar"></div>
      </div>
    </div>
  </body>
</html>
