<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>OfficeFC</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Saira+Condensed:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#070a0e; --surface:#10141b; --surface-2:#1a212b; --line:rgba(255,255,255,.08);
    --text:#eef2f6; --text-dim:#8b95a4; --text-faint:#4c5563;
    --accent:#00ff87; --win:#22e06a; --draw:#9aa6b4; --loss:#ff4d6d;
    --font-head:'Archivo',system-ui,sans-serif; --font-body:'Archivo',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(ellipse at 50% -10%, #121a24, #05070a 60%);
    font-family:var(--font-body); color:var(--text); overflow:hidden;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  button{font-family:inherit;color:inherit;border:none;background:none;}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
  input{font-family:inherit;}

  /* ---------- stage / phone frame ---------- */
  .stage{position:fixed;inset:0;display:grid;place-items:center;}
  .phone-scaler{transform-origin:center;}
  .phone{
    width:390px;height:844px;background:var(--bg);border-radius:46px;overflow:hidden;
    display:flex;flex-direction:column;position:relative;
    box-shadow:0 0 0 10px #1c2128, 0 0 0 12px #2a323d, 0 40px 90px -20px rgba(0,0,0,.8);
  }
  .phone::before{content:"";position:absolute;top:11px;left:50%;transform:translateX(-50%);
    width:118px;height:30px;background:#000;border-radius:18px;z-index:30;}
  .status-bar{height:50px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:0 30px 0 32px;font-size:14px;color:var(--text);padding-top:6px;}
  .phone-scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;}
  .phone-scroll::-webkit-scrollbar{display:none;}
  .screen-pad{padding:8px 18px 28px;}

  /* ---------- tab bar ---------- */
  .tab-bar{flex:0 0 auto;height:84px;display:flex;align-items:flex-start;justify-content:space-around;
    padding:12px 14px 0;background:linear-gradient(0deg,var(--bg) 60%,transparent);
    border-top:1px solid var(--line);position:relative;}
  .tab-btn{display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;padding-top:6px;
    color:var(--text-faint);font-size:10px;font-weight:600;cursor:pointer;transition:color .15s;}
  .tab-btn span{font-family:var(--font-head);letter-spacing:.02em;}
  .tab-btn.active{color:var(--accent);}
  .fab{width:60px;height:60px;border-radius:50%;background:var(--accent);color:#06080c;
    display:grid;place-items:center;margin-top:-22px;cursor:pointer;flex:0 0 auto;
    box-shadow:0 8px 24px -4px color-mix(in srgb,var(--accent) 60%,transparent),0 0 0 6px var(--bg);
    transition:transform .15s;}
  .fab:active{transform:scale(.92);}

  /* ---------- generic atoms ---------- */
  .kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);font-weight:700;font-family:var(--font-head);line-height:1.4;}
  .ofc-btn{transition:transform .12s, filter .15s;}
  .ofc-btn:active{transform:scale(.97);}
  .ofc-iconbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
    background:var(--surface);border:1px solid var(--line);color:var(--text);cursor:pointer;flex:0 0 auto;}
  .ofc-row{transition:border-color .15s,transform .1s;}
  .ofc-row:active{transform:scale(.99);}
  .tag-you{font-family:var(--font-mono);font-size:8.5px;font-weight:800;letter-spacing:.1em;
    background:var(--accent);color:#06080c;padding:2px 5px;border-radius:5px;}
  .link-btn{font-size:12px;color:var(--accent);font-weight:700;cursor:pointer;font-family:var(--font-head);}
  .empty{color:var(--text-dim);font-size:13px;text-align:center;padding:8px;}

  /* ---------- home ---------- */
  .ofc-pill{padding:7px 12px;background:var(--surface);border:1px solid var(--line);border-radius:99px;cursor:pointer;}
  .hero-card{background:
      radial-gradient(120% 100% at 100% 0%, color-mix(in srgb,var(--accent) 16%,transparent), transparent 55%),
      linear-gradient(160deg,#141b24,#0c1016);
    border:1px solid var(--line);border-radius:22px;padding:18px;cursor:pointer;width:100%;text-align:left;
    position:relative;overflow:hidden;}
  .hero-rank{font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--text);display:inline-block;margin-top:2px;}
  .hero-elo{font-size:34px;font-weight:800;letter-spacing:-.03em;color:var(--accent);line-height:1;}
  .log-cta{margin-top:14px;width:100%;display:flex;align-items:center;justify-content:space-between;
    padding:17px 20px;background:var(--accent);color:#06080c;border-radius:16px;cursor:pointer;
    font-family:var(--font-head);font-weight:800;font-size:17px;letter-spacing:.01em;
    box-shadow:0 10px 30px -8px color-mix(in srgb,var(--accent) 55%,transparent);transition:transform .12s;}
  .log-cta:active{transform:scale(.98);}
  .nemesis-card{width:100%;display:flex;align-items:center;gap:14px;padding:14px;
    background:linear-gradient(120deg,color-mix(in srgb,var(--loss) 12%,var(--surface)),var(--surface));
    border:1px solid color-mix(in srgb,var(--loss) 28%,transparent);border-radius:18px;cursor:pointer;text-align:left;}

  /* ---------- leaderboard ---------- */
  .chip-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 12px;padding:0 18px 2px;}
  .chip-scroll::-webkit-scrollbar{display:none;}
  .season-chip{flex:0 0 auto;padding:8px 14px;border-radius:99px;background:var(--surface);
    border:1px solid var(--line);color:var(--text-dim);font-weight:700;font-size:12.5px;cursor:pointer;
    display:flex;align-items:center;gap:6px;font-family:var(--font-head);}
  .season-chip.active{background:var(--text);color:#06080c;border-color:var(--text);}
  .live-dot{width:6px;height:6px;border-radius:9px;background:var(--accent);box-shadow:0 0 6px var(--accent);}
  .season-chip.active .live-dot{background:var(--win);box-shadow:none;}
  .search-box{display:flex;align-items:center;gap:9px;padding:11px 14px;background:var(--surface);
    border:1px solid var(--line);border-radius:13px;color:var(--text-dim);margin-bottom:12px;}
  .search-box input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;}
  .search-box input::placeholder{color:var(--text-faint);}
  .table-head{display:flex;align-items:center;gap:12px;padding:2px 14px 8px;font-size:10px;
    text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);font-weight:700;}
  .table-head>span:nth-child(3){width:52px;text-align:right;}
  .board-row{display:flex;align-items:center;gap:11px;padding:9px 12px;width:100%;text-align:left;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer;}

  /* ---------- seasons ---------- */
  .current-season{background:
      radial-gradient(120% 120% at 0% 0%, color-mix(in srgb,var(--accent) 14%,transparent), transparent 50%),
      linear-gradient(160deg,#141b24,#0c1016);
    border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);border-radius:22px;padding:18px;margin-bottom:22px;}
  .progress{height:7px;border-radius:99px;background:var(--surface-2);margin-top:16px;overflow:hidden;}
  .progress>div{height:100%;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#fff));border-radius:99px;}
  .past-season{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;}

  /* ---------- profile ---------- */
  .profile-hero{display:flex;align-items:center;gap:16px;padding:6px 2px 18px;}
  .chart-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 12px 8px;margin-bottom:14px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .h2h-row{display:flex;align-items:center;gap:11px;padding:10px 12px;width:100%;text-align:left;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer;}
  .nemesis-tag{font-family:var(--font-mono);font-size:8px;font-weight:800;letter-spacing:.12em;
    color:var(--loss);border:1px solid color-mix(in srgb,var(--loss) 45%,transparent);
    background:color-mix(in srgb,var(--loss) 12%,transparent);padding:3px 6px;border-radius:6px;display:inline-block;}

  /* ---------- match detail ---------- */
  .match-hero{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(160deg,#141b24,#0c1016);
    border:1px solid var(--line);border-radius:22px;padding:22px 16px;}
  .vs-banner{display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:linear-gradient(160deg,#141b24,#0c1016);border:1px solid var(--line);border-radius:22px;padding:20px 14px;}

  /* ---------- h2h ---------- */
  .pick-chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:6px 12px 6px 7px;border-radius:99px;
    background:var(--surface);border:1px solid var(--line);color:var(--text-dim);font-weight:700;font-size:12.5px;cursor:pointer;}
  .pick-chip.active{background:color-mix(in srgb,var(--accent) 14%,var(--surface));border-color:var(--accent);color:var(--text);}
  .res-dot{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-family:var(--font-mono);
    font-weight:800;font-size:12px;flex:0 0 auto;}
  .res-W{background:var(--win);color:#06080c;} .res-L{background:var(--loss);color:#fff;} .res-D{background:var(--draw);color:#06080c;}
  .meeting-row{display:flex;align-items:center;gap:10px;padding:10px 12px;width:100%;
    background:var(--surface);border:1px solid var(--line);border-radius:13px;cursor:pointer;}

  /* ---------- archive ---------- */
  .archive-champ{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;margin-bottom:16px;
    background:linear-gradient(120deg,rgba(255,210,74,.14),var(--surface));border:1px solid rgba(255,210,74,.3);}

  /* ---------- log flow ---------- */
  .step-track{display:flex;gap:5px;padding:0 2px;}
  .step-seg{flex:1;height:4px;border-radius:99px;background:var(--surface-2);transition:background .25s;}
  .step-seg.on{background:var(--accent);}
  .step-q{font-family:var(--font-head);font-weight:800;font-size:21px;letter-spacing:-.02em;margin-bottom:14px;}
  .step-hint{font-size:13px;color:var(--text-dim);margin:-8px 0 16px;}
  .opp-pick{display:flex;align-items:center;gap:13px;padding:11px 13px;width:100%;text-align:left;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:border-color .15s;}
  .opp-pick.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface));}
  .check-circle{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#06080c;display:grid;place-items:center;flex:0 0 auto;}
  .field-label{display:flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-dim);font-weight:700;margin-bottom:9px;}
  .team-field{display:flex;align-items:center;gap:10px;width:100%;padding:14px;background:var(--surface);
    border:1px solid var(--line);border-radius:13px;cursor:pointer;font-size:14.5px;}
  .team-field.filled{border-color:color-mix(in srgb,var(--accent) 35%,transparent);}
  .team-pop{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;}
  .team-list{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow-y:auto;scrollbar-width:thin;}
  .team-opt{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:10px;width:100%;text-align:left;
    color:var(--text);font-size:14px;cursor:pointer;}
  .team-opt:hover{background:var(--surface-2);}
  .team-opt.active{background:color-mix(in srgb,var(--accent) 12%,var(--surface));}
  .score-entry{display:flex;align-items:center;justify-content:center;gap:14px;padding:18px 0;
    background:var(--surface);border:1px solid var(--line);border-radius:18px;}
  .stepper{display:flex;align-items:center;justify-content:center;gap:10px;}
  .stepper button{width:34px;height:34px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);
    color:var(--text);font-size:22px;font-weight:700;cursor:pointer;display:grid;place-items:center;line-height:1;}
  .stepper button:disabled{opacity:.3;}
  .elo-preview-mini{display:flex;align-items:center;gap:8px;margin-top:14px;padding:13px 15px;border-radius:13px;
    background:color-mix(in srgb,var(--accent) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);
    font-size:13px;color:var(--text-dim);font-weight:600;}
  .photo-drop{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;
    background:var(--surface);border:2px dashed var(--line);border-radius:18px;color:var(--text-dim);cursor:pointer;transition:border-color .15s;}
  .photo-drop:active{border-color:var(--accent);}
  .photo-remove{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;
    background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px);}
  .attached-note{display:flex;align-items:center;gap:7px;margin-top:12px;color:var(--win);font-size:13px;font-weight:700;}
  .skip-link{display:block;margin:18px auto 0;color:var(--text-dim);font-size:13px;font-weight:600;cursor:pointer;}
  .review-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;}
  .review-divider{height:1px;background:var(--line);margin:14px 0;}
  .result-burst{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;
    background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
    box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent);}
  .result-burst.loss{background:color-mix(in srgb,var(--loss) 14%,transparent);color:var(--loss);box-shadow:0 0 0 1px color-mix(in srgb,var(--loss) 30%,transparent);}
  .result-burst.draw{background:var(--surface-2);color:var(--draw);box-shadow:0 0 0 1px var(--line);}

  /* ---------- setup ---------- */
  .palette-row{display:flex;gap:10px;}
  .swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .12s;}
  .swatch.active{border-color:var(--text);transform:scale(1.12);box-shadow:0 0 0 3px var(--bg),0 0 0 4px currentColor;}
  .text-input{width:100%;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:13px;
    color:var(--text);font-size:15px;outline:none;transition:border-color .15s;}
  .text-input:focus,.text-input:focus-within{border-color:var(--accent);}
  .text-input.prefix{display:flex;align-items:center;gap:4px;}
  .text-input.prefix input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:15px;}
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

  <!-- OfficeFC data engine (deterministic mock league) -->
  <script>
/* OfficeFC — mock data + derived-stat engine.
   Everything (records, form, H2H, ELO history) is computed from one match list
   so the prototype is internally consistent. Deterministic via a seeded PRNG. */
(function () {
  "use strict";

  // ---- seeded PRNG (mulberry32) ----
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry32(20260603);
  const ri = (lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1));
  const pick = (arr) => arr[Math.floor(rnd() * arr.length)];

  // ---- players ----  (you = p1)
  const players = [
    { id: "p1", name: "Marcus Bell", handle: "marcus", jersey: 10, color: "#00ff87", isYou: true },
    { id: "p2", name: "Dave Okafor", handle: "big_dave", jersey: 9, color: "#ff5470" },
    { id: "p3", name: "Priya Shah", handle: "priya", jersey: 7, color: "#5b9dff" },
    { id: "p4", name: "Tom Nguyen", handle: "tommy", jersey: 4, color: "#ffb020" },
    { id: "p5", name: "Aisha Khan", handle: "aisha", jersey: 11, color: "#c06bff" },
    { id: "p6", name: "Jordan Lee", handle: "jlee", jersey: 6, color: "#36e0c8" },
    { id: "p7", name: "Nina Costa", handle: "nina", jersey: 8, color: "#ff8a3d" },
    { id: "p8", name: "Leo Martins", handle: "leo", jersey: 3, color: "#9aa7ff" },
  ];
  players.forEach((p) => {
    p.initials = p.name.split(" ").map((w) => w[0]).join("").slice(0, 2).toUpperCase();
  });
  const byId = Object.fromEntries(players.map((p) => [p.id, p]));

  // ---- generic team names (NO real clubs) ----
  const teams = [
    "Crimson Albion", "Northgate United", "Royal Vega", "Azzurri Select",
    "Bavaria XI", "La Costa CF", "Harbour City", "Verde Nacional",
    "Iron Foundry", "Capital Athletic", "Sierra Rovers", "Black Forest SV",
    "Oranje Stars", "Maple Wanderers", "Delta Galácticos", "Phoenix Borough",
  ];

  // ---- seasons ----
  const seasons = [
    { id: "s3", name: "Summer Showdown", year: 2026, start: "2026-04-01", end: "2026-06-30", active: true },
    { id: "s2", name: "Spring Cup", year: 2026, start: "2026-01-06", end: "2026-03-31", active: false,
      championId: "p2", runnerUpId: "p3", potm: [{ m: "Jan", playerId: "p2" }, { m: "Feb", playerId: "p6" }, { m: "Mar", playerId: "p2" }] },
    { id: "s1", name: "Winter League", year: 2025, start: "2025-10-01", end: "2025-12-20", active: false,
      championId: "p3", runnerUpId: "p1", potm: [{ m: "Oct", playerId: "p1" }, { m: "Nov", playerId: "p3" }, { m: "Dec", playerId: "p3" }] },
  ];
  const activeSeason = seasons[0];

  // ---- ELO engine ----
  const K = 32, BASE = 1500;
  const expected = (a, b) => 1 / (1 + Math.pow(10, (b - a) / 400));

  // ---- match generation for the active season ----
  // Engineer Marcus(p1) vs Dave(p2) all-time to be a painful 2–9.
  const matches = [];
  let mid = 1;
  const dayMs = 86400000;
  const seasonStart = new Date(activeSeason.start).getTime();

  function score(winnerStronger) {
    // returns [wScore, lScore] for a decisive game, biased to realistic football scores
    const margin = pick([1, 1, 1, 2, 2, 3]);
    const loser = pick([0, 0, 1, 1, 2]);
    return [loser + margin, loser];
  }

  function addMatch(dayOffset, aId, bId, aGoals, bGoals, hasPhoto) {
    const date = new Date(seasonStart + dayOffset * dayMs).toISOString().slice(0, 10);
    matches.push({ id: "m" + mid++, seasonId: activeSeason.id, date, aId, bId, aGoals, bGoals, hasPhoto });
  }

  // Scripted nemesis thread: Marcus vs Dave this season — Dave dominates.
  const mdResults = [ // [marcusGoals, daveGoals] — engineered to a brutal 2–9
    [1, 3], [0, 2], [2, 4], [0, 1], [2, 5],
    [3, 2] /* Marcus W */, [1, 2], [0, 3], [1, 4],
    [2, 1] /* Marcus W */, [2, 3],
  ];
  let d = 1;
  mdResults.forEach((r, i) => { addMatch(d, "p1", "p2", r[0], r[1], i % 2 === 0); d += ri(2, 5); });

  // Other random matches among everyone (incl. Marcus vs others)
  const others = players.map((p) => p.id);
  for (let i = 0; i < 54; i++) {
    let aId = pick(others), bId = pick(others);
    while (bId === aId) bId = pick(others);
    // skip extra Marcus-Dave (already scripted)
    if ((aId === "p1" && bId === "p2") || (aId === "p2" && bId === "p1")) { i--; continue; }
    const aWin = rnd() > 0.5;
    const [w, l] = score(true);
    let ag, bg;
    if (rnd() < 0.16) { const t = pick([0, 1, 1, 2]); ag = t; bg = t; } // draw
    else if (aWin) { ag = w; bg = l; } else { ag = l; bg = w; }
    addMatch(d, aId, bId, ag, bg, rnd() < 0.55);
    d += ri(0, 3);
  }

  // sort chronologically, then process ELO
  matches.sort((x, y) => (x.date < y.date ? -1 : x.date > y.date ? 1 : 0));
  const ratings = Object.fromEntries(players.map((p) => [p.id, BASE]));
  const history = Object.fromEntries(players.map((p) => [p.id, [{ date: activeSeason.start, rating: BASE }]]));
  matches.forEach((m) => {
    const Ra = ratings[m.aId], Rb = ratings[m.bId];
    const Sa = m.aGoals > m.bGoals ? 1 : m.aGoals < m.bGoals ? 0 : 0.5;
    const Sb = 1 - Sa;

function eloPreview(myId, oppId, myGoals, oppGoals) {
  const O = window.OFC,
    K = 32;

  const S = myGoals > oppGoals ? 1 : myGoals < oppGoals ? 0 : 0.5;
  const d = Math.round(K * (S - exp));
  return d;
}
