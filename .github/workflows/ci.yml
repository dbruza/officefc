name: CI

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Match the Cloud Functions runtime (firebase.json `nodejs24`) so tests run on
          # the Node major that production executes. (The mobile test script also needs
          # node --test glob patterns, available since v21.)
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
            functions/package-lock.json
            test/rules/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix mobile ci
          npm --prefix functions ci
          npm --prefix test/rules ci

      - name: Create CI web environment
        run: |
          cp mobile/.env.example mobile/.env
          sed -i 's|EXPO_PUBLIC_FIREBASE_API_KEY=.*|EXPO_PUBLIC_FIREBASE_API_KEY=ci-api-key|' mobile/.env
          sed -i 's|EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=.*|EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=demo-officefc.firebaseapp.com|' mobile/.env
          sed -i 's|EXPO_PUBLIC_FIREBASE_PROJECT_ID=.*|EXPO_PUBLIC_FIREBASE_PROJECT_ID=demo-officefc|' mobile/.env
          sed -i 's|EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=.*|EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=demo-officefc.firebasestorage.app|' mobile/.env
          sed -i 's|EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=.*|EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=000000000000|' mobile/.env
          sed -i 's|EXPO_PUBLIC_FIREBASE_APP_ID=.*|EXPO_PUBLIC_FIREBASE_APP_ID=1:000000000000:web:ci|' mobile/.env
          sed -i 's|EXPO_PUBLIC_USE_EMULATORS=.*|EXPO_PUBLIC_USE_EMULATORS=0|' mobile/.env

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check version sync
        run: npm run version:check

      - name: Type-check mobile app
        run: npm run typecheck:mobile

      - name: Build Cloud Functions once
        run: npm --prefix functions run build

      - name: Export production web app
        # CI bundles against the placeholder config written above rather than real
        # credentials, so the "never ship a placeholder" guard has to stand down here.
        # The check that the bundle matches mobile/.env still runs.
        env:
          OFFICEFC_ALLOW_PLACEHOLDER_CONFIG: "1"
        run: npm run build:web

      - name: Test Cloud Functions
        run: npm --prefix functions run test:compiled

      - name: Test mobile app
        run: npm --prefix mobile run test:compiled

      - name: Test extraction and ELO
        run: npm run test:compiled

      - name: Test Firebase security rules
        run: npm run test:rules:compiled

      - name: Check append-only recalculation performance
        run: node scripts/benchmark-performance.mjs
